name: Headless CLI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-quickjs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - name: Check Rust toolchain
        run: rustup show
      - name: Build isolated debug app
        run: |
          profile="$HOME/Library/Containers/io.github.haukuen.venera/Data/tmp/headless-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "VENERA_HEADLESS_PROFILE=$profile" >> "$GITHUB_ENV"
          flutter build macos --debug --dart-define=VENERA_TEST_DATA_PATH="$profile"
      - name: Run QuickJS functional smoke test
        run: >-
          dart run tool/headless_smoke.dart
          build/macos/Build/Products/Debug/venera.app/Contents/MacOS/venera
          "$VENERA_HEADLESS_PROFILE"

  linux-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 xvfb
      - run: flutter pub get
      - name: Check Rust toolchain
        run: rustup show
      - run: flutter build linux --debug
      - name: Verify help and JSON version output
        run: |
          binary=build/linux/x64/debug/bundle/venera
          xvfb-run -a "$binary" --headless --json --version > version.json
          python3 -c 'import json; d=json.load(open("version.json")); assert d["ok"] and d["command"] == "version"'
          test "$(wc -l < version.json)" -eq 1
          xvfb-run -a "$binary" --headless --help | grep -q "Venera headless comic-source CLI"

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get
      - name: Check Rust toolchain
        run: rustup show
      - run: flutter build windows --debug
      - name: Verify help and JSON version output
        shell: pwsh
        run: |
          $binary = (Resolve-Path 'build/windows/x64/runner/Debug/venera.exe').Path
          $versionOut = Join-Path $env:RUNNER_TEMP 'venera-version.json'
          $versionErr = Join-Path $env:RUNNER_TEMP 'venera-version.err'
          $process = Start-Process -FilePath $binary `
            -ArgumentList '--headless','--json','--version' `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $versionOut `
            -RedirectStandardError $versionErr
          if ($process.ExitCode -ne 0) {
            Get-Content $versionErr
            throw "Version command exited with $($process.ExitCode)"
          }
          $lines = @(Get-Content $versionOut | Where-Object { $_.Trim() })
          if ($lines.Count -ne 1) {
            throw "Expected one JSON line, got $($lines.Count)"
          }
          $version = $lines[0] | ConvertFrom-Json
          if (-not $version.ok -or $version.command -ne 'version') {
            throw 'Unexpected JSON version envelope'
          }

          $helpOut = Join-Path $env:RUNNER_TEMP 'venera-help.txt'
          $helpErr = Join-Path $env:RUNNER_TEMP 'venera-help.err'
          $process = Start-Process -FilePath $binary `
            -ArgumentList '--headless','--help' `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $helpOut `
            -RedirectStandardError $helpErr
          if ($process.ExitCode -ne 0) {
            Get-Content $helpErr
            throw "Help command exited with $($process.ExitCode)"
          }
          if (-not ((Get-Content $helpOut -Raw) -match 'Venera headless comic-source CLI')) {
            throw 'Headless help marker was not found'
          }
